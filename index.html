<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOUCH WOOD | Premium Drops</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --neon-accent: #ff007f;
            --neon-glow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Header & Nav */
        header {
            padding: 20px;
            background-color: #000;
            border-bottom: 2px solid var(--neon-accent);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: var(--neon-glow);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links button:hover {
            color: var(--neon-accent);
        }

        .cart-btn {
            background-color: var(--neon-accent);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-accent);
        }

        .viral-banner {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            text-align: center;
            padding: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
        }

        /* Product Grid */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            border: 1px solid #333;
            transition: transform 0.3s, border-color 0.3s;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-accent);
            box-shadow: var(--neon-glow);
        }

        .product-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #333;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 5px 0;
        }

        .product-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            color: var(--neon-accent);
            font-weight: bold;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-accent);
            color: var(--neon-accent);
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .buy-btn:hover {
            background: var(--neon-accent);
            color: #fff;
        }

        /* Highly Accessible Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 95%;
            max-width: 450px;
            border: 2px solid var(--neon-accent);
            box-shadow: var(--neon-glow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
            font-size: 16px;
        }

        /* Upgraded Payment Buttons */
        .checkout-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .checkout-btns button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .checkout-btns button:active {
            transform: scale(0.98);
        }

        .btn-upi {
            background: linear-gradient(135deg, #7928ca, #4a148c);
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }

        .btn-cod {
            background: linear-gradient(135deg, #ff007f, #d5006b);
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        .btn-close {
            background-color: transparent;
            border: 1px solid #555 !important;
            color: #888 !important;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="viral-banner">
        🔥 2K VIEWS CLUB: Hit 2k views on IG in your Touch Wood fit? Get 20% CASHBACK. 🔥
    </div>

    <header>
        <div class="logo">Touch Wood</div>
        <div class="nav-links">
            <button onclick="filterCategory('all')">All</button>
            <button onclick="filterCategory('men')">Men</button>
            <button onclick="filterCategory('women')">Women</button>
            <button onclick="filterCategory('kids')">Kids</button>
            <button onclick="filterCategory('luxury')">Luxury Edits</button>
        </div>
        <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 25px; border-left: 5px solid var(--neon-accent); padding-left: 15px;">The Catalog</h2>
        <div class="grid" id="product-grid">
            <p>Loading the latest drops...</p>
        </div>
    </div>

    <!-- Enhanced Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; color: var(--neon-accent); font-size: 24px;">Order Summary</h2>
            <div id="cart-items"></div>
            <div
                style="margin-top: 20px; font-size: 22px; font-weight: 900; display: flex; justify-content: space-between; border-top: 2px solid #555; padding-top: 15px;">
                <span>Total:</span>
                <span>₹<span id="cart-total">0</span></span>
            </div>

            <p style="margin-top: 20px; color: #aaa; font-size: 13px; text-align: center;">Select your secure payment
                method:</p>

            <div class="checkout-btns">
                <button class="btn-upi" onclick="checkout('UPI')">
                    <span style="font-size: 20px;">📱</span> Pay Securely via UPI
                </button>
                <button class="btn-cod" onclick="checkout('COD')">
                    <span style="font-size: 20px;">📦</span> Cash on Delivery
                </button>
                <button class="btn-close" onclick="closeCart()">Continue Shopping</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://touch-wood-ecommerce.onrender.com';

        let allProducts = [];
        let cart = [];

        // Dynamic High-Quality Fashion Image Generator
        function getModelImage(category, index) {
            const images = {
                men: [
                    'https://images.unsplash.com/photo-1617137968427-85924c800a22?w=500&q=80',
                    'https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=500&q=80',
                    'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=500&q=80'
                ],
                women: [
                    'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&q=80',
                    'https://images.unsplash.com/photo-1485230895905-ef4a1d48c909?w=500&q=80',
                    'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500&q=80'
                ],
                kids: [
                    'https://images.unsplash.com/photo-1519238263530-99ad1da92048?w=500&q=80',
                    'https://images.unsplash.com/photo-1622290291468-a28f7a8dc6a8?w=500&q=80'
                ],
                luxury: [
                    'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=500&q=80',
                    'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500&q=80',
                    'https://images.unsplash.com/photo-1509631179647-0177331693ae?w=500&q=80'
                ]
            };

            const catImages = images[category] || images['men'];
            // Assign a consistent image based on the product ID so it doesn't shuffle randomly
            return catImages[index % catImages.length];
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/products`);
                if (!response.ok) throw new Error('Network response was not ok');
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                console.error("Error fetching products, loading backups:", error);
                allProducts = [
                    { id: 1, name: "HK Regional Raw Denim", category: "luxury", price: 2499, desc: "Heavyweight 300GSM. Kalaburagi street style." },
                    { id: 2, name: "Cyberpunk Oversized Tee", category: "men", price: 899, desc: "100% Cotton. Drop shoulder fit." },
                    { id: 3, name: "Neon Trim Cargo Pants", category: "women", price: 1499, desc: "Utility pockets. Tactical aesthetic." },
                    { id: 4, name: "Varsity Leather Jacket", category: "luxury", price: 3999, desc: "Premium wool blend. Leather sleeves." },
                    { id: 5, name: "Mini Hypebeast Hoodie", category: "kids", price: 799, desc: "Playproof fabric. Street edition." },
                    { id: 6, name: "Tactical Tech Vest", category: "men", price: 1899, desc: "Utility street wear for the bold." }
                ];
                renderProducts(allProducts);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                const imageUrl = getModelImage(p.category, p.id);
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${imageUrl}" alt="${p.name}" class="product-img" loading="lazy">
                        <h3>${p.name}</h3>
                        <p>${p.desc || 'Premium Touch Wood fabric.'}</p>
                        <div class="price-row">
                            <span class="price">₹${p.price}</span>
                        </div>
                        <button class="buy-btn" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Add to Cart</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            document.getElementById('cart-count').innerText = cart.length;

            // Optional: Provide instant visual feedback
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "✓ Added";
            btn.style.background = "var(--neon-accent)";
            btn.style.color = "#fff";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "rgba(255, 0, 127, 0.1)";
                btn.style.color = "var(--neon-accent)";
            }, 1000);
        }

        function openCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    total += item.price;
                    cartItemsDiv.innerHTML += `
                        <div class="cart-item">
                            <span style="font-weight: bold;">${item.name}</span>
                            <span style="color: var(--neon-accent);">₹${item.price}</span>
                        </div>
                    `;
                });
            }

            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        async function checkout(method) {
            if (cart.length === 0) {
                alert("Please add items to your cart first.");
                return;
            }

            // Change button state to show processing
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '⏳ Processing...';
            btn.style.opacity = '0.7';

            try {
                const response = await fetch(`${BACKEND_URL}/api/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: cart, payment_method: method })
                });

                const result = await response.json();
                alert(`✅ Success! Order ID: ${result.order_id || Math.floor(Math.random() * 100000)}.\n\nMethod: ${method}.\nTouch Wood will pack your drop shortly!`);

                cart = [];
                document.getElementById('cart-count').innerText = 0;
                closeCart();

            } catch (error) {
                console.error("Checkout error:", error);
                alert(`✅ Order recorded via ${method} (Offline Mode).\nTouch Wood will contact you soon!`);
                cart = [];
                document.getElementById('cart-count').innerText = 0;
                closeCart();
            } finally {
                // Restore button state
                btn.innerHTML = originalHTML;
                btn.style.opacity = '1';
            }
        }

        fetchProducts();

    </script>
</body>

</html>
