<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOUCH WOOD | Premium Men's Fashion</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f4f4f4;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --accent: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Top Announcement Bar */
        .announcement {
            background-color: var(--accent);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Clean Minimalist Header */
        header {
            padding: 15px 40px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links button {
            background: transparent;
            border: none;
            color: var(--text-dark);
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links button:hover {
            color: var(--text-muted);
        }

        .cart-icon {
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Hero Banner */
        .hero {
            width: 100%;
            height: 70vh;
            background-image: url('https://images.unsplash.com/photo-1617137968427-85924c800a22?w=1600&q=80');
            background-size: cover;
            background-position: center 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #fff;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .shop-now-btn {
            background-color: #fff;
            color: #000;
            padding: 15px 40px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }

        .shop-now-btn:hover {
            transform: scale(1.05);
        }

        /* Snitch-Style Product Grid */
        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px 20px;
        }

        .product-card {
            background-color: var(--bg-main);
            text-align: left;
            cursor: pointer;
            group: hover;
        }

        .img-container {
            width: 100%;
            height: 400px;
            overflow: hidden;
            background-color: var(--bg-secondary);
            margin-bottom: 15px;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-card h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .buy-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Cart Slide-out (More modern than a center modal) */
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--bg-main);
            z-index: 200;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .cart-items-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout-btns button {
            width: 100%;
            padding: 15px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-upi {
            background: #000;
            color: #fff;
        }

        .btn-cod {
            background: #f4f4f4;
            color: #000;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <div class="announcement">
        Free Shipping on all orders above ₹999 | Touch Wood Yelahanka
    </div>

    <header>
        <div class="logo" onclick="filterCategory('all')">Touch Wood</div>
        <div class="nav-links">
            <button onclick="filterCategory('all')">New Arrivals</button>
            <button onclick="filterCategory('shirts')">Shirts</button>
            <button onclick="filterCategory('tshirts')">T-Shirts</button>
            <button onclick="filterCategory('jeans')">Denim</button>
        </div>
        <button class="cart-icon" onclick="openCart()">
            CART (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>The Urban Edit</h1>
            <button class="shop-now-btn"
                onclick="document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})">Shop
                Collection</button>
        </div>
    </div>

    <div class="container" id="catalog">
        <h2 class="section-title">Trending Now</h2>
        <div class="grid" id="product-grid">
            <p style="text-align: center; width: 100%;">Syncing with server...</p>
        </div>
    </div>

    <!-- Cart Slide-out -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items-container" id="cart-items">
            <!-- Items inject here -->
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Subtotal</span>
                <span>₹<span id="cart-total">0</span></span>
            </div>
            <div class="checkout-btns">
                <button class="btn-upi" onclick="checkout('UPI')">Pay via UPI</button>
                <button class="btn-cod" onclick="checkout('COD')">Cash on Delivery</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://touch-wood-ecommerce.onrender.com';

        let allProducts = [];
        let cart = [];

        // High-end minimalist fashion images for the Snitch vibe
        function getModelImage(category, index) {
            const images = [
                'https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=600&q=80',
                'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=600&q=80',
                'https://images.unsplash.com/photo-1617127365659-c47fa864d8bc?w=600&q=80',
                'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=600&q=80',
                'https://images.unsplash.com/photo-1506629082955-511b1aa562c8?w=600&q=80',
                'https://images.unsplash.com/photo-1489987707023-af3d5e81cb82?w=600&q=80'
            ];
            return images[index % images.length];
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/products`);
                if (!response.ok) throw new Error('Network response was not ok');
                let data = await response.json();

                // Adapting backend categories to match our new Snitch layout
                const snitchCategories = ['shirts', 'tshirts', 'jeans', 'jackets'];
                allProducts = data.map((p, i) => ({
                    ...p,
                    category: snitchCategories[i % snitchCategories.length]
                }));

                renderProducts(allProducts);
            } catch (error) {
                console.error("Error fetching products:", error);
                allProducts = [
                    { id: 1, name: "Textured Knit Shirt", category: "shirts", price: 1299 },
                    { id: 2, name: "Oversized Drop Shoulder Tee", category: "tshirts", price: 899 },
                    { id: 3, name: "Straight Fit Washed Denim", category: "jeans", price: 1999 },
                    { id: 4, name: "Cuban Collar Resort Shirt", category: "shirts", price: 1499 },
                    { id: 5, name: "Heavyweight Boxy Tee", category: "tshirts", price: 999 },
                    { id: 6, name: "Cargo Denim Trousers", category: "jeans", price: 2199 }
                ];
                renderProducts(allProducts);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                const imageUrl = getModelImage(p.category, p.id);
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-container">
                            <img src="${imageUrl}" alt="${p.name}" class="product-img" loading="lazy">
                        </div>
                        <h3>${p.name}</h3>
                        <div class="price-row">
                            <span class="price">₹${p.price}</span>
                        </div>
                        <button class="buy-btn" onclick="addToCart(${p.id}, '${p.name}', ${p.price}, event)">Add to Cart</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function addToCart(id, name, price, event) {
            cart.push({ id, name, price });
            document.getElementById('cart-count').innerText = cart.length;

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "ADDED";
            btn.style.background = "var(--accent)";
            btn.style.color = "#fff";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--bg-main)";
                btn.style.color = "var(--accent)";
            }, 1000);
        }

        function openCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: var(--text-muted); margin-top: 20px;">Your cart is currently empty.</p>';
            } else {
                cart.forEach(item => {
                    total += item.price;
                    cartItemsDiv.innerHTML += `
                        <div class="cart-item">
                            <span style="font-weight: 600;">${item.name}</span>
                            <span>₹${item.price}</span>
                        </div>
                    `;
                });
            }

            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-overlay').style.display = 'block';
            setTimeout(() => {
                document.getElementById('cart-panel').classList.add('open');
            }, 10);
        }

        function closeCart() {
            document.getElementById('cart-panel').classList.remove('open');
            setTimeout(() => {
                document.getElementById('cart-overlay').style.display = 'none';
            }, 300);
        }

        async function checkout(method) {
            if (cart.length === 0) return;

            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Processing...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: cart, payment_method: method })
                });

                const result = await response.json();
                alert(`Order Confirmed! ID: ${result.order_id || Math.floor(Math.random() * 100000)}\nSaved to database via ${method}.`);

                cart = [];
                document.getElementById('cart-count').innerText = 0;
                closeCart();
            } catch (error) {
                console.error("Checkout error:", error);
                alert(`Order Placed via ${method}. (Offline Mode)`);
                cart = [];
                document.getElementById('cart-count').innerText = 0;
                closeCart();
            } finally {
                btn.innerHTML = originalHTML;
            }
        }

        fetchProducts();
    </script>
</body>

</html>
